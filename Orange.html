<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Pickels</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
    }

    /* ▼ ヘッダー ▼ */
    header {
      width: 100%;
      background-color: rgba(51, 51, 51, 0.7); /* ← 半透明に */
      color: white;
      padding: 20px 0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    header h1 {
      margin: 0;
      font-size: 2em;
    }

    header nav {
      margin-top: 10px;
    }

    header nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 1em;
      transition: color 0.2s;
    }

    header nav a:hover {
      color: #ffd700;
    }

    /* ▼ メインビジュアル（画像のみ） ▼ */
    .hero {
      width: 90%;
      height: 500px;
      border-radius: 20px; 
      background-image: url("https://www.free-materials.com/adm/wp-content/uploads/2019/10/adpDSC_0032-.jpg");
      background-size: cover;
      background-position: center;
      margin-top: 140px; /* ヘッダー固定分余白を追加 */
      margin-left: 70px;  
    }

    .game-button {
      display: inline-block;
      margin: 20px;
    }
    
    .game-button a {
      text-decoration: none;
      color: inherit;
    }

    .game-button img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border: 4px solid #444;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .game-button img:hover {
      transform: scale(1.05);
    }

    .game-title {
      margin-top: 10px;
      font-size: 1.2em;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- ▼ ヘッダー ▼ -->
  <header>
    <h1>Pickels</h1>
    <nav>
      <a href="#game1">Fruit Adventure</a>
      <a href="#game2">XX DAYS BETA</a>
    </nav>
  </header>

  <!-- ▼ メインビジュアル（画像のみ） ▼ -->
  <div class="hero"></div>

  <!-- ▼ ゲームボタン ▼ -->
  <div class="game-button" id="game1">
    <a href="game1/index.html">
      <img src="c:\Users\parop\Downloads\506-.png" alt="Game 1">
      <div class="game-title">Fruit Adventure</div>
    </a>
  </div>

  <div class="game-button" id="game2">
    <a href="game2/index.html">
      <img src="images/game2.jpg" alt="Game 2">
      <div class="game-title">XX DAYS BETA</div>
    </a>
  </div>

</body>
</html>
